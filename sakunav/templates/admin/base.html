<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }} · 管理{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/admin.css">
{% block head %}{% endblock %}
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="/admin">{{ site.title }}</a>
      <span class="sidebar-tag">管理面板</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin" class="{{ 'active' if active == 'dashboard' }}">概览</a>
      <a href="/admin/links" class="{{ 'active' if active == 'links' }}">链接管理</a>
      <a href="/admin/categories" class="{{ 'active' if active == 'categories' }}">分类管理</a>
      <a href="/admin/themes" class="{{ 'active' if active == 'themes' }}">主题</a>
      <a href="/admin/plugins" class="{{ 'active' if active == 'plugins' }}">插件</a>
      <a href="/admin/settings" class="{{ 'active' if active == 'settings' }}">设置</a>
      {% for item in plugin_nav %}
      <a href="{{ item.path }}" target="_blank">{{ item.name }}</a>
      {% endfor %}
    </nav>
    <div class="sidebar-foot">
      <a href="/" target="_blank">查看导航页 ↗</a>
      <form method="post" action="/logout" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link-btn">退出登录</button>
      </form>
    </div>
  </aside>
  <main class="admin-main">
    {% for f in flashes %}
    <div class="flash flash-{{ f.kind }}">{{ f.message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/admin.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
